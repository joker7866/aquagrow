# AquaGrow assistant settings (safe to commit: contains no secrets).
#
# baseUrl is YOUR backend from /backend (it holds the AI API key, the app never does).
# Leave empty to ship without the assistant; the app then shows "not set up".
# Examples:
#   baseUrl=https://aquagrow-assistant.example.com
#   baseUrl=http://10.0.2.2:8787      (backend running on your PC, Android emulator, debug builds only)
# A value in local.properties (assistant.baseUrl=...) overrides this file.
baseUrl=
